name: CI

# Se ejecuta en cada push y en cada pull request. Es la red de seguridad: hasta
# ahora lint, tests y build se corrían a mano, así que un commit roto solo se
# descubría al desplegar.
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tee` guarda la salida para poder publicarla aunque las pruebas fallen.
      - name: Tests (lógica + render)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee salida-pruebas.txt

      # El registro completo del trabajo exige permisos de administrador en
      # GitHub, así que cuando algo fallaba no había forma de leer el motivo
      # desde fuera. Este resumen sí es público y queda en la pestaña "Checks"
      # del commit, que es donde se mira para saber qué se rompió.
      - name: Resumen de las pruebas
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '### Últimas líneas de las pruebas'
            echo '```'
            tail -n 80 salida-pruebas.txt 2>/dev/null || echo 'sin salida'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
