name: CI

# Se ejecuta en cada push y en cada pull request. Es la red de seguridad: hasta
# ahora lint, tests y build se corrían a mano, así que un commit roto solo se
# descubría al desplegar.
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tee` guarda la salida para poder publicarla aunque las pruebas fallen.
      - name: Tests (lógica + render)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee salida-pruebas.txt

      # El registro completo del trabajo exige permisos de administrador en
      # GitHub, así que cuando algo fallaba no había forma de leer el motivo
      # desde fuera. Este resumen sí es público y queda en la pestaña "Checks"
      # del commit, que es donde se mira para saber qué se rompió.
      - name: Resumen de las pruebas
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '### Últimas líneas de las pruebas'
            echo '```'
            tail -n 80 salida-pruebas.txt 2>/dev/null || echo 'sin salida'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      # Presupuesto de rendimiento: corta la CI si el arranque o el total de JS
      # crecen sin control. La app debe seguir abriendo rapido en tablets
      # modestas aunque se le anadan funciones.
      - name: Presupuesto de tamano del bundle
        run: npm run verificar:tamano

  # Pruebas de dos equipos: dos contextos de navegador contra un Supabase falso
  # que reproduce el versionado de consultas y el control de stock. Es el unico
  # sitio donde se prueba el comportamiento real entre dispositivos.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de dos equipos
        run: npm run test:e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
